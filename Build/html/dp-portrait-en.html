<!doctype html><html lang="en"><head><meta charset="utf-8"><title>DP portrait en</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&family=Noto+Serif+Devanagari:wght@500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet"><style>
:root{--ink:#0E1233;--indigo:#1A1F4D;--gold:#C9A24B;--goldlt:#E6CB8A;--ivory:#F6EFDD;--mist:#B9BDDA;--golddk:#8a6a1f;--saffron:#E38B3A;--text:#2a2f55}
*{box-sizing:border-box;margin:0;padding:0}
html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:'Jost','Noto Sans Devanagari',sans-serif;color:var(--ivory)}
body.hi{font-family:'Noto Sans Devanagari','Jost',sans-serif}
.serif{font-family:'Cormorant Garamond','Noto Serif Devanagari',serif}
.hi .serif{font-family:'Noto Serif Devanagari','Cormorant Garamond',serif;letter-spacing:0!important}
.tiro{font-family:'Tiro Devanagari Hindi','Noto Serif Devanagari',serif}
.caps{text-transform:uppercase;letter-spacing:.26em}
.hi .caps{letter-spacing:.03em!important;text-transform:none!important}
.it{font-style:italic}.hi .it{font-style:normal}
.rule{height:1px;background:var(--gold);position:relative;margin:0 auto}
.rule:after{content:"";position:absolute;left:50%;top:-3px;width:7px;height:7px;background:var(--gold);transform:translateX(-50%) rotate(45deg)}
.rule.l{margin-left:0}.rule.l:after{left:0;transform:rotate(45deg)}
.dark{background:radial-gradient(ellipse at 50% 14%,#283080 0%,#151b55 36%,var(--ink) 78%);color:var(--ivory)}
.light{background:var(--ivory) url('../art/bg-brochure.jpg') center/cover;color:var(--ink)}
.stars{position:absolute;inset:0;pointer-events:none;opacity:.32;background-image:radial-gradient(rgba(230,203,138,.6) 1px,transparent 1.4px),radial-gradient(rgba(230,203,138,.35) 1px,transparent 1.4px),radial-gradient(rgba(255,255,255,.35) .8px,transparent 1.2px);background-size:90px 90px,53px 53px,137px 137px;background-position:0 0,27px 31px,61px 13px}
.mand{position:absolute;pointer-events:none}
.rel{position:relative}
.kicker{display:flex;align-items:center;gap:10px;font-size:10.5px;color:var(--gold);font-weight:500}
.dark .kicker{color:var(--goldlt)}
.kicker:before,.kicker.c:after{content:"";width:26px;height:1px;background:currentColor;opacity:.7}
.kicker.c{justify-content:center}
.arch{border-radius:999px 999px 0 0;overflow:hidden;border:3px solid var(--gold);box-shadow:0 0 0 7px rgba(14,18,51,.92),0 0 0 8.5px var(--gold),0 22px 60px rgba(0,0,0,.45)}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.chk{list-style:none}
.chk li{position:relative;padding-left:18px}
.chk li:before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
.wa-pill{display:inline-flex;align-items:center;gap:12px;background:var(--ivory);color:var(--ink);border-radius:999px;border:2px solid var(--gold);text-decoration:none}
.wa-pill .num{font-family:'Jost',sans-serif;font-weight:600;letter-spacing:.03em}
.qr{background:var(--ivory);border-radius:10px;border:1.5px solid var(--gold)}
.qr svg{display:block;width:100%;height:100%}

body{width:1080px;height:1080px;position:relative;overflow:hidden}
.mand{width:1240px;left:-80px;top:-160px;opacity:.12}
.ring{position:absolute;left:50%;top:70px;width:620px;height:620px;margin-left:-310px;border-radius:50%;overflow:hidden;border:5px solid var(--gold);box-shadow:0 0 0 14px #0E1233,0 0 0 16px var(--gold),0 0 90px rgba(201,162,75,.35)}
.ring img{width:100%;height:100%;object-fit:cover;object-position:50% 14%}
.name{position:absolute;left:0;right:0;top:752px;text-align:center;font-size:66px;font-weight:600;letter-spacing:.12em;line-height:1}
.hi .name{font-size:76px;letter-spacing:0;top:740px;line-height:1.2}
.sub{position:absolute;left:0;right:0;top:850px;text-align:center;font-size:23px;color:var(--goldlt)}
.hi .sub{font-size:32px;top:858px}
.mk{position:absolute;left:50%;top:922px;width:66px;margin-left:-33px}
/* full-bleed variant for WhatsApp circle crop */
.full{position:absolute;inset:0}
.full img{width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.full:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,transparent 58%,rgba(14,18,51,.35) 72%,rgba(14,18,51,.85) 100%)}
.halo{position:absolute;inset:26px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 0 10px rgba(201,162,75,.18)}
/* logo */
.lg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lg img.m{width:420px}
.lg .n{font-size:74px;font-weight:600;letter-spacing:.12em;margin-top:34px;line-height:1.1}
.hi .lg .n{font-size:86px;letter-spacing:0;line-height:1.3}
.lg .rule{width:380px;margin-top:22px}
.lg .s{margin-top:22px;font-size:23px;color:var(--goldlt);text-align:center}
.hi .lg .s{font-size:32px}
</style></head><body class="en dark"><div class="stars"></div><img class="mand" src="../brand/mandala.svg" alt=""><div class="ring"><img src="../art/portrait-formal.jpg" alt=""></div><div class="name serif">DHIRAJ SARDA</div><div class="sub caps">PLR Therapist · Hypnotherapist</div><img class="mk" src="../brand/mark.svg" alt=""></body></html>
